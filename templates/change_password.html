{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Change password | WeatherHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
</head>
<body><main class="profile-shell"><nav class="profile-nav"><a href="{% url 'dashboard' %}" class="brand"><i class="bi bi-cloud-sun-fill"></i> WeatherHub</a><a href="{% url 'profile' %}" class="nav-return"><i class="bi bi-arrow-left"></i> Profile</a></nav><div class="profile-wrap"><section class="form-card"><div class="form-icon"><i class="bi bi-shield-lock-fill"></i></div><p class="profile-kicker">ACCOUNT SECURITY</p><h1>Update your password.</h1><p class="form-subtitle">Choose a strong password you do not use elsewhere.</p>{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}<form method="POST">{% csrf_token %}<label for="current_password">Current password</label><div class="field"><i class="bi bi-lock"></i><input id="current_password" type="password" name="current_password" class="form-control" required></div><label for="new_password">New password</label><div class="field"><i class="bi bi-key"></i><input id="new_password" type="password" name="new_password" class="form-control" required></div><label for="confirm_password">Confirm new password</label><div class="field"><i class="bi bi-shield-check"></i><input id="confirm_password" type="password" name="confirm_password" class="form-control" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Update password <i class="bi bi-check2"></i></button><a href="{% url 'profile' %}" class="btn btn-light">Cancel</a></div></form></section></div></main></body>
</html>

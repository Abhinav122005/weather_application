{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit profile | WeatherHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
</head>
<body><main class="profile-shell"><nav class="profile-nav"><a href="{% url 'dashboard' %}" class="brand"><i class="bi bi-cloud-sun-fill"></i> WeatherHub</a><a href="{% url 'profile' %}" class="nav-return"><i class="bi bi-arrow-left"></i> Profile</a></nav><div class="profile-wrap"><section class="form-card"><div class="form-icon"><i class="bi bi-pencil-square"></i></div><p class="profile-kicker">PROFILE SETTINGS</p><h1>Make it yours.</h1><p class="form-subtitle">Keep your personal details up to date.</p>{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}<form method="POST">{% csrf_token %}<label for="username">Username</label><div class="field"><i class="bi bi-person"></i><input id="username" type="text" class="form-control" name="username" value="{{ user.username }}" required></div><label for="email">Email address</label><div class="field"><i class="bi bi-envelope"></i><input id="email" type="email" class="form-control" name="email" value="{{ user.email }}" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Save changes <i class="bi bi-check2"></i></button><a href="{% url 'profile' %}" class="btn btn-light">Cancel</a></div></form></section></div></main></body>
</html>

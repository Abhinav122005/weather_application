{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile | WeatherHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">
</head>
<body>
<main class="profile-shell">
    <nav class="profile-nav"><a href="{% url 'dashboard' %}" class="brand"><i class="bi bi-cloud-sun-fill"></i> WeatherHub</a><a href="{% url 'dashboard' %}" class="nav-return"><i class="bi bi-arrow-left"></i> Dashboard</a></nav>
    <div class="profile-wrap">
        {% if messages %}{% for message in messages %}<div class="alert alert-success alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
        <section class="profile-card">
            <div class="avatar"><i class="bi bi-person-fill"></i></div>
            <p class="profile-kicker">ACCOUNT SETTINGS</p>
            <h1>{{ user.username }}</h1>
            <p class="profile-email">{{ user.email }}</p>
            <div class="profile-details"><div><span>Username</span><strong>{{ user.username }}</strong></div><div><span>Email address</span><strong>{{ user.email }}</strong></div></div>
            <div class="profile-actions"><a href="{% url 'edit_profile' %}" class="btn btn-primary"><i class="bi bi-pencil-square"></i> Edit profile</a><a href="{% url 'change_password' %}" class="btn btn-outline-primary"><i class="bi bi-shield-lock"></i> Password</a><a href="{% url 'logout' %}" class="btn btn-link text-danger"><i class="bi bi-box-arrow-right"></i> Sign out</a></div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
